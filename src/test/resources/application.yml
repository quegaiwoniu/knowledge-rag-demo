spring:
  application:
    name: knowledge-rag-demo
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  ai:
    model:
      chat: none
    openai:
      api-key: test-key

app:
  ai:
    provider: longcat-openai-compatible
    default-message: Hello from test
    summary-max-input-length: 1200
    use-stub-service: true
  weather:
    use-mock-provider: true
