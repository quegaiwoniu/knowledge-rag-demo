spring:
  application:
    name: knowledge-rag-demo
  ai:
    model:
      chat: openai
    openai:
      base-url: https://api.zetatechs.com
      # 不要把真实密钥写进仓库，运行时通过环境变量 OPENAI_API_KEY 注入。
      api-key: ${OPENAI_API_KEY:}
      chat:
        # Replace with the actual model name exposed by your provider.
        options:
          model: gpt-4.1-mini

server:
  port: 8080

app:
  ai:
    provider: zetatechs-openai-compatible
    default-message: Hello from knowledge-rag-demo
    summary-max-input-length: 1200
    use-stub-service: false
  weather:
    use-mock-provider: true
    geocoding-base-url: https://geocoding-api.open-meteo.com/v1/search
    forecast-base-url: https://api.open-meteo.com/v1/forecast

kind: Application
