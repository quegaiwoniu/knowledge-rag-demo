spring:
  application:
    name: knowledge-rag-demo
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
    username: ${PGUSER:rag}
    password: ${PGPASSWORD:ragpass}
  ai:
    model:
      chat: openai
    openai:
      base-url: https://api.longcat.chat/openai
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: LongCat-2.0
      embedding:
        # The provider UI may show an endpoint ending with /v1, but Spring AI
        # appends /v1/embeddings itself, so configure the root URL here.
        base-url: ${OPENAI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        initialize-schema: true
        schema-name: public
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024

server:
  port: 8080

app:
  ai:
    provider: longcat-openai-compatible
    default-message: Hello from knowledge-rag-demo
    summary-max-input-length: 1200
    use-stub-service: false
  weather:
    use-mock-provider: true
    geocoding-base-url: https://geocoding-api.open-meteo.com/v1/search
    forecast-base-url: https://api.open-meteo.com/v1/forecast
  rag:
    sample-docs-path: docs/sample-docs
    chunk-size: 500
    chunk-overlap: 80

kind: Application
